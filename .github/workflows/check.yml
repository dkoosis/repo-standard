name: check

# Always triggers — never paths/paths-ignore. A skipped workflow never reports
# the required check context, so a docs-only PR could not merge under branch
# protection. The detect step decides docs-only; the later steps skip and the
# job still reports green. Any changed path outside the docs set runs the full
# gate. Detect is a step, not its own job: each job bills at least a minute.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # Unknown base (new branch, all-zero SHA) → run the gate.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The docs-only set is repo-standard's (ci-docs-skip): drop entries to
          # narrow it; adding one is a finding.
          run_check="$(git diff --name-status --no-renames "$base" "$head" | awk -F'\t' '
            NF < 2 { next }
            $2 !~ /(\.md$|^docs\/|^\.beads\/|^\.claude\/|^\.gitignore$|^LICENSE$)/ { print "true"; exit }
          ')"
          echo "run_check=${run_check:-false}" >> "$GITHUB_OUTPUT"

      - name: docs-only — skip the gate
        if: steps.detect.outputs.run_check != 'true'
        run: echo "Only docs changed — reporting check without running the gate."

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.run_check == 'true'
        with:
          go-version-file: go.mod
          check-latest: false

      - name: golangci-lint (latest release)
        if: steps.detect.outputs.run_check == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: check
        if: steps.detect.outputs.run_check == 'true'
        run: make check

      # CI = local check + race; no step here duplicates what a Makefile
      # target already owns.
      - name: race
        if: steps.detect.outputs.run_check == 'true'
        run: make race
